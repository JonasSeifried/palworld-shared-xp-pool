name: release

# Tag a commit and the zip that goes on Nexus is built from it:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tests run first, so a tag that would ship a broken mod produces no
# release at all rather than a release nobody should download.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. v1.0.0 (no release is published)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Run the suite
        run: lua5.4 mod/tests/test_pool.lua

      # On a tag that is the tag; on a manual run GITHUB_REF_NAME is the branch,
      # so the version has to be given.
      - name: Work out the version
        id: version
        env:
          GIVEN: ${{ inputs.version }}
        run: |
          raw="${GIVEN:-$GITHUB_REF_NAME}"
          echo "value=${raw#v}" >> "$GITHUB_OUTPUT"

      # tools/build_release.py explains what goes in each archive and why.
      # Keeping it in a script rather than inline here means it can be run and
      # checked locally before a tag exists.
      - name: Build the archives
        id: build
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          python3 tools/build_release.py "$VERSION"
          echo "manual=dist/SharedXPPool-$VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "workshop=dist/SharedXPPool-$VERSION-workshop.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: SharedXPPool-${{ steps.version.outputs.value }}
          path: dist/*.zip

      # Only a tag publishes. A manual run is for checking the archive before
      # committing to a version number.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A semver pre-release tag has a hyphen in it (v1.0.0-beta.1). Flag
          # those, so a beta is never what GitHub offers a player as "Latest".
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac

          # printf rather than a heredoc: this is a YAML block scalar, so every
          # line is indented, and an indented heredoc terminator never matches.
          printf '%s\n' \
            'Install on the **host** only, and you need UE4SS.' \
            '' \
            'Extract `SharedXPPool-*.zip` over your Palworld folder -- the one with `Pal\` in it. It carries the mod once for each folder a UE4SS build reads mods from, so it works whether UE4SS came from the Steam Workshop or from Okaetsu'"'"'s GitHub release. `INSTALL.txt` inside has the rest.' \
            '' \
            '`SharedXPPool-*-workshop.zip` is the Steam Workshop payload, for the Palworld Mod Uploader. Not for players.' \
            > release-notes.md

          gh release create "$GITHUB_REF_NAME" $prerelease \
            "${{ steps.build.outputs.manual }}" \
            "${{ steps.build.outputs.workshop }}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
