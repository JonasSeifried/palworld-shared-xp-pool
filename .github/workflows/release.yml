name: release

# Tag a commit and the zip that goes on Nexus is built from it:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tests run first, so a tag that would ship a broken mod produces no
# release at all rather than a release nobody should download.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. v1.0.0 (no release is published)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Run the suite
        run: lua5.4 mod/tests/test_pool.lua

      # On a tag that is the tag; on a manual run GITHUB_REF_NAME is the branch,
      # so the version has to be given.
      - name: Work out the version
        id: version
        env:
          GIVEN: ${{ inputs.version }}
        run: |
          raw="${GIVEN:-$GITHUB_REF_NAME}"
          echo "value=${raw#v}" >> "$GITHUB_OUTPUT"

      # The archive mirrors the game folder from Pal/ down, so the whole thing
      # extracts over a Palworld install and every file lands where UE4SS looks
      # for it. That is also the layout Vortex deploys, so the same file works
      # for manual installers and for mod managers.
      - name: Build the archive
        id: build
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          root="dist/SharedXPPool"
          target="$root/Pal/Binaries/Win64/ue4ss/Mods/SharedXPPool"
          mkdir -p "$target"
          cp -r mod/SharedXPPool/Scripts "$target/Scripts"
          cp mod/SharedXPPool/enabled.txt "$target/enabled.txt"
          cp mod/INSTALL.txt "$target/INSTALL.txt"
          cp LICENSE "$target/LICENSE.txt"

          name="SharedXPPool-$VERSION.zip"
          (cd "$root" && zip -r -q "../$name" .)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=dist/$name" >> "$GITHUB_OUTPUT"
          unzip -l "dist/$name"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.path }}

      # Only a tag publishes. A manual run is for checking the archive before
      # committing to a version number.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.path }}" \
            --title "$GITHUB_REF_NAME" \
            --notes "Extract over your Palworld install. Host only. Needs Okaetsu's UE4SS fork -- see the README." \
            --verify-tag
