name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mod:
    name: mod (lua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The mod runs on the Lua that UE4SS ships, which is 5.4. The suite uses
      # integer bitwise operators, so 5.2 and earlier will not even parse it.
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Run the suite
        run: lua5.4 mod/tests/test_pool.lua

  save-editor:
    name: save editor (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        working-directory: save-editor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run the suite
        working-directory: save-editor
        run: python -m pytest -q
